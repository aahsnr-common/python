[project]
name = "your-project"
version = "0.1.0"
description = ""
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Rule categories, roughly mapped to the tools they replace:
#   E, W   - pycodestyle (style)
#   F      - pyflakes (unused imports/vars, undefined names, ...)
#   I      - isort (import sorting)
#   UP     - pyupgrade (modernize syntax for the target Python version)
#   B      - flake8-bugbear (likely bugs / footguns)
#   S      - flake8-bandit (security checks, ~= bandit)
#   C4     - flake8-comprehensions (unnecessary comprehensions)
#   SIM    - flake8-simplify (simplifiable code)
#   PL     - a subset of pylint's rules
#   RUF    - Ruff-native rules
select = ["E", "W", "F", "I", "UP", "B", "S", "C4", "SIM", "PL", "RUF"]

# Rules worth loosening by default:
#   S101  - "assert used" (asserts are normal in test files)
#   PLR2004 - "magic value used in comparison" (noisy without real payoff)
ignore = ["S101", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Test files commonly need asserts and may deliberately import unused fixtures.
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["your_project"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# basedpyright: type checking
# ---------------------------------------------------------------------------
[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"   # bump to "strict" once the codebase is clean
reportMissingImports = true
reportUnusedImport = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
